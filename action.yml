name: 'Netsons Deploy'
description: 'Deploy Laravel applications to Netsons shared hosting via FTP or Git'
author: 'Alberto Arena'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  strategy:
    description: 'Deployment strategy: ftp or git'
    required: true
  environment:
    description: 'Target environment: stage or production'
    required: true
  php-version:
    description: 'PHP version for build'
    default: '8.4'
  node-version:
    description: 'Node.js version for build'
    default: '22'
  package-manager:
    description: 'Node package manager: npm or yarn'
    default: 'yarn'
  remote-php:
    description: 'Remote PHP binary path on Netsons'
    default: '/usr/local/bin/ea-php84'
  remote-composer:
    description: 'Remote Composer binary path on Netsons'
    default: '/usr/local/bin/composer'
  deploy-path:
    description: 'Remote deploy path relative to home'
    required: true
  ssh-host:
    description: 'SSH hostname'
    required: true
  ssh-port:
    description: 'SSH port'
    default: '65100'
  ssh-user:
    description: 'SSH username'
    required: true
  ssh-private-key:
    description: 'SSH private key'
    required: true
  ssh-key-passphrase:
    description: 'SSH key passphrase (if any)'
    default: ''
  ssh-known-hosts:
    description: 'SSH known hosts entry'
    required: true
  ssh-retries:
    description: 'Max SSH connection retry attempts'
    default: '3'
  ssh-retry-delay:
    description: 'Seconds to wait between SSH retries'
    default: '10'
  ssh-connect-timeout:
    description: 'SSH connection timeout in seconds'
    default: '30'
  releases-keep:
    description: 'Number of releases to keep'
    default: '5'
  ftp-host:
    description: 'FTP hostname (FTP strategy only)'
    default: ''
  ftp-port:
    description: 'FTP port'
    default: '21'
  ftp-user:
    description: 'FTP username (FTP strategy only)'
    default: ''
  ftp-password:
    description: 'FTP password (FTP strategy only)'
    default: ''
  git-repo:
    description: 'Git repository HTTPS URL (git strategy only)'
    default: ''
  git-branch:
    description: 'Git branch to deploy (git strategy only)'
    default: 'main'
  git-token:
    description: 'GitHub token for private repo access (git strategy only)'
    default: ''

runs:
  using: 'composite'
  steps:
    # ── Validate inputs ───────────────────────────────────────────────────
    - name: Validate inputs
      shell: bash
      run: |
        if [[ "${{ inputs.strategy }}" != "ftp" && "${{ inputs.strategy }}" != "git" ]]; then
          echo "::error::Invalid strategy: ${{ inputs.strategy }}. Must be 'ftp' or 'git'."
          exit 1
        fi
        if [[ "${{ inputs.strategy }}" == "ftp" ]]; then
          if [[ -z "${{ inputs.ftp-host }}" || -z "${{ inputs.ftp-user }}" || -z "${{ inputs.ftp-password }}" ]]; then
            echo "::error::FTP strategy requires ftp-host, ftp-user, and ftp-password inputs."
            exit 1
          fi
        fi
        if [[ "${{ inputs.strategy }}" == "git" ]]; then
          if [[ -z "${{ inputs.git-repo }}" ]]; then
            echo "::error::Git strategy requires git-repo input."
            exit 1
          fi
        fi

    # ── SSH Setup ─────────────────────────────────────────────────────────
    - name: Setup SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ inputs.ssh-private-key }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        echo "${{ inputs.ssh-known-hosts }}" >> ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
        eval "$(ssh-agent -s)"
        if [ -n "${{ inputs.ssh-key-passphrase }}" ]; then
          export SSH_KEY_PASSPHRASE="${{ inputs.ssh-key-passphrase }}"
          cat > /tmp/askpass.sh << 'SCRIPT'
        #!/bin/bash
        echo "$SSH_KEY_PASSPHRASE"
        SCRIPT
          chmod +x /tmp/askpass.sh
          SSH_ASKPASS=/tmp/askpass.sh SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key
        else
          ssh-add ~/.ssh/deploy_key
        fi
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
        echo "SSH_RETRIES=${{ inputs.ssh-retries }}" >> $GITHUB_ENV
        echo "SSH_RETRY_DELAY=${{ inputs.ssh-retry-delay }}" >> $GITHUB_ENV
        echo "SSH_CONNECT_TIMEOUT=${{ inputs.ssh-connect-timeout }}" >> $GITHUB_ENV
        # Write SSH retry helper functions
        cat > /tmp/ssh-helpers.sh <<'HELPERS'
        ssh_with_opts() {
          ssh -o ConnectTimeout=${SSH_CONNECT_TIMEOUT:-30} \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              "$@"
        }
        ssh_retry() {
          local max_attempts=${SSH_RETRIES:-3}
          local delay=${SSH_RETRY_DELAY:-10}
          local attempt=1
          while [ $attempt -le $max_attempts ]; do
            ssh_with_opts "$@" && return 0
            local exit_code=$?
            if [ $exit_code -ne 255 ]; then
              return $exit_code
            fi
            echo "::warning::SSH connection failed (attempt ${attempt}/${max_attempts}). Retrying in ${delay}s..."
            sleep $delay
            attempt=$((attempt + 1))
          done
          echo "::error::SSH connection failed after ${max_attempts} attempts"
          return 255
        }
        scp_retry() {
          local max_attempts=${SSH_RETRIES:-3}
          local delay=${SSH_RETRY_DELAY:-10}
          local attempt=1
          while [ $attempt -le $max_attempts ]; do
            scp -o ConnectTimeout=${SSH_CONNECT_TIMEOUT:-30} "$@" && return 0
            local exit_code=$?
            if [ $exit_code -ne 255 ]; then
              return $exit_code
            fi
            echo "::warning::SCP connection failed (attempt ${attempt}/${max_attempts}). Retrying in ${delay}s..."
            sleep $delay
            attempt=$((attempt + 1))
          done
          echo "::error::SCP connection failed after ${max_attempts} attempts"
          return 255
        }
        HELPERS
        chmod +x /tmp/ssh-helpers.sh

    # ── Generate release timestamp ────────────────────────────────────────
    - name: Generate release directory
      id: release
      shell: bash
      run: echo "dir=$(date -u '+%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

    # ── Create release directory (FTP only — copies current for incremental sync) ──
    - name: Create release directory
      if: inputs.strategy == 'ftp'
      shell: bash
      run: |
        source /tmp/ssh-helpers.sh
        ssh_retry -p ${{ inputs.ssh-port }} ${{ inputs.ssh-user }}@${{ inputs.ssh-host }} bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/${{ inputs.deploy-path }}
          mkdir -p releases/${{ steps.release.outputs.dir }}
          if [ -L current ]; then
            cp -a current/. releases/${{ steps.release.outputs.dir }}/
          fi
        REMOTE

    # ── Ensure releases directory exists (Git only — git clone creates the release dir) ──
    - name: Ensure releases directory
      if: inputs.strategy == 'git'
      shell: bash
      run: |
        source /tmp/ssh-helpers.sh
        ssh_retry -p ${{ inputs.ssh-port }} ${{ inputs.ssh-user }}@${{ inputs.ssh-host }} bash -s <<'REMOTE'
          set -euo pipefail
          mkdir -p ~/${{ inputs.deploy-path }}/releases
        REMOTE

    # ── Deploy (FTP) ──────────────────────────────────────────────────────
    - name: Deploy via FTP
      if: inputs.strategy == 'ftp'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ inputs.ftp-host }}
        port: ${{ inputs.ftp-port }}
        username: ${{ inputs.ftp-user }}
        password: ${{ inputs.ftp-password }}
        local-dir: ./
        server-dir: ${{ inputs.deploy-path }}/releases/${{ steps.release.outputs.dir }}/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/.env
          **/.env.*
          **/storage/logs/**

    # ── Prepare clone URL (Git only) ─────────────────────────────────────
    - name: Prepare clone URL
      if: inputs.strategy == 'git'
      shell: bash
      env:
        GIT_TOKEN: ${{ inputs.git-token }}
      run: |
        GIT_REPO=$(echo "${{ inputs.git-repo }}" | tr -d '\\')
        if [ -n "${GIT_TOKEN}" ]; then
          echo "CLONE_URL=$(echo "${GIT_REPO}" | sed "s|https://github.com/|https://x-access-token:${GIT_TOKEN}@github.com/|")" >> $GITHUB_ENV
        else
          echo "CLONE_URL=${GIT_REPO}" >> $GITHUB_ENV
        fi

    # ── Deploy (Git) ──────────────────────────────────────────────────────
    - name: Deploy via Git
      if: inputs.strategy == 'git'
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_PORT: ${{ inputs.ssh-port }}
        SSH_USER: ${{ inputs.ssh-user }}
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        REMOTE_PHP: ${{ inputs.remote-php }}
        REMOTE_COMPOSER: ${{ inputs.remote-composer }}
        GIT_BRANCH_VAL: ${{ inputs.git-branch }}
        RELEASE_DIR: ${{ steps.release.outputs.dir }}
      run: |
        source /tmp/ssh-helpers.sh
        # Clone repo on server (CLONE_URL from GITHUB_ENV via Prepare clone URL step)
        ssh_retry -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} \
          "cd ~/${DEPLOY_PATH} && rm -rf releases/${RELEASE_DIR} && git clone --branch ${GIT_BRANCH_VAL} --single-branch --depth 1 '${CLONE_URL}' releases/${RELEASE_DIR}"

        # Install Composer dependencies and cleanup
        ssh_retry -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} \
          "cd ~/${DEPLOY_PATH}/releases/${RELEASE_DIR} && mkdir -p bootstrap/cache && ${REMOTE_PHP} ${REMOTE_COMPOSER} install --no-dev --no-interaction --prefer-dist --optimize-autoloader && rm -rf .git .github tests"

        # Upload built assets
        if [ -d "public/build" ]; then
          scp_retry -P ${SSH_PORT} -r public/build ${SSH_USER}@${SSH_HOST}:~/${DEPLOY_PATH}/releases/${RELEASE_DIR}/public/
        fi

    # ── Shared resources ──────────────────────────────────────────────────
    - name: Setup shared resources
      shell: bash
      run: |
        source /tmp/ssh-helpers.sh
        ssh_retry -p ${{ inputs.ssh-port }} ${{ inputs.ssh-user }}@${{ inputs.ssh-host }} bash -s <<'REMOTE'
          set -euo pipefail
          DEPLOY_BASE=~/${{ inputs.deploy-path }}
          RELEASE_PATH=${DEPLOY_BASE}/releases/${{ steps.release.outputs.dir }}

          mkdir -p ${DEPLOY_BASE}/shared/storage/app/public
          mkdir -p ${DEPLOY_BASE}/shared/storage/framework/{cache/data,sessions,views}
          mkdir -p ${DEPLOY_BASE}/shared/storage/logs

          if [ ! -f ${DEPLOY_BASE}/shared/.env ]; then
            if [ -f ${RELEASE_PATH}/.env.example ]; then
              cp ${RELEASE_PATH}/.env.example ${DEPLOY_BASE}/shared/.env
            fi
            touch ${DEPLOY_BASE}/.first_deploy
          fi

          rm -f ${RELEASE_PATH}/.env
          ln -sfn ${DEPLOY_BASE}/shared/.env ${RELEASE_PATH}/.env
          rm -rf ${RELEASE_PATH}/storage
          ln -sfn ${DEPLOY_BASE}/shared/storage ${RELEASE_PATH}/storage
        REMOTE

    # ── Post-deploy (migrations, caches) ──────────────────────────────────
    - name: Post-deploy
      shell: bash
      run: |
        source /tmp/ssh-helpers.sh
        ssh_retry -p ${{ inputs.ssh-port }} ${{ inputs.ssh-user }}@${{ inputs.ssh-host }} bash -s <<REMOTE
          set -euo pipefail
          cd ~/${{ inputs.deploy-path }}/releases/${{ steps.release.outputs.dir }}
          ${{ inputs.remote-php }} artisan migrate --force --no-interaction
          ${{ inputs.remote-php }} artisan cache:clear
          ${{ inputs.remote-php }} artisan config:cache
          ${{ inputs.remote-php }} artisan route:cache
          ${{ inputs.remote-php }} artisan view:cache
          ${{ inputs.remote-php }} artisan event:cache
          ${{ inputs.remote-php }} artisan queue:restart 2>/dev/null || true
        REMOTE

    # ── Switch release ────────────────────────────────────────────────────
    - name: Activate release
      shell: bash
      run: |
        source /tmp/ssh-helpers.sh
        ssh_retry -p ${{ inputs.ssh-port }} ${{ inputs.ssh-user }}@${{ inputs.ssh-host }} bash -s <<'REMOTE'
          set -euo pipefail
          DEPLOY_BASE=~/${{ inputs.deploy-path }}
          RELEASE_PATH=${DEPLOY_BASE}/releases/${{ steps.release.outputs.dir }}

          ln -sfn ${RELEASE_PATH} ${DEPLOY_BASE}/current

          # Generate proxy index.php in public/ (where .htaccess routes to)
          mkdir -p ${DEPLOY_BASE}/public
          cat > ${DEPLOY_BASE}/public/index.php <<'PROXY'
        <?php
        $releasePath = dirname(__DIR__) . '/current';
        if (file_exists($releasePath . '/storage/framework/maintenance.php')) {
            require $releasePath . '/storage/framework/maintenance.php';
        }
        require $releasePath . '/public/index.php';
        PROXY

          # Copy public .htaccess (Laravel front controller rules)
          if [ -f "${RELEASE_PATH}/public/.htaccess" ]; then
            cp ${RELEASE_PATH}/public/.htaccess ${DEPLOY_BASE}/public/.htaccess
          fi

          if [ -d "${RELEASE_PATH}/public/build" ]; then
            mkdir -p ${DEPLOY_BASE}/public/build
            cp -r ${RELEASE_PATH}/public/build/* ${DEPLOY_BASE}/public/build/
          fi
        REMOTE

    # ── .htaccess ─────────────────────────────────────────────────────────
    - name: Upload root .htaccess
      shell: bash
      run: |
        source /tmp/ssh-helpers.sh
        ssh_retry -p ${{ inputs.ssh-port }} ${{ inputs.ssh-user }}@${{ inputs.ssh-host }} bash -s <<'REMOTE'
          cat > ~/${{ inputs.deploy-path }}/.htaccess <<'HTACCESS'
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_URI} !^/public/
            RewriteRule ^(.*)$ public/$1 [L]
        </IfModule>
        HTACCESS
        REMOTE

    # ── Cleanup ───────────────────────────────────────────────────────────
    - name: Cleanup old releases
      shell: bash
      run: |
        source /tmp/ssh-helpers.sh
        ssh_retry -p ${{ inputs.ssh-port }} ${{ inputs.ssh-user }}@${{ inputs.ssh-host }} bash -s <<REMOTE
          set -euo pipefail
          cd ~/${{ inputs.deploy-path }}/releases
          TOTAL=\$(ls -1d */ 2>/dev/null | wc -l)
          if [ "\${TOTAL}" -gt "${{ inputs.releases-keep }}" ]; then
            REMOVE=\$(( TOTAL - ${{ inputs.releases-keep }} ))
            ls -1d */ | sort | head -n \${REMOVE} | xargs -I {} rm -rf {}
            echo "Removed \${REMOVE} old release(s)."
          fi
        REMOTE

    # ── Summary ───────────────────────────────────────────────────────────
    - name: Deployment summary
      shell: bash
      run: |
        echo "::notice::Deployed to ${{ inputs.environment }} — release ${{ steps.release.outputs.dir }}"
